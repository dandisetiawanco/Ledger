name: Ledger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build, Unit & PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit, accounting invariant, and security tests (H2)
        working-directory: backend
        run: ./mvnw -B test
      - name: Run PostgreSQL Testcontainers integration verification
        working-directory: backend
        run: ./mvnw -B test-compile failsafe:integration-test failsafe:verify -Dit.test=PostgresIntegrationIT -Ddocker.java.api.version=1.44
      - name: Surface Failsafe error summary on failure
        if: failure()
        working-directory: backend
        run: |
          for f in target/failsafe-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "::error title=$(basename "$f")::$(tr '\n' ' ' < "$f" | head -c 900)"
              cat "$f"
            fi
          done

  frontend:
    name: Frontend Typecheck, Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript strict check
        run: pnpm typecheck:web
      - name: ESLint check
        run: pnpm lint:web
      - name: Vitest unit tests
        run: pnpm test:web
      - name: Next.js production build
        run: |
          if ! pnpm build:web > /tmp/next-build.log 2>&1; then
            echo "Retrying Next.js build once after transient error..."
            if ! pnpm build:web > /tmp/next-build.log 2>&1; then
              cat /tmp/next-build.log
              echo "::error title=Next.js build failed::$(tail -n 30 /tmp/next-build.log | tr '\n' ' ' | head -c 900)"
              exit 1
            fi
          fi
          cat /tmp/next-build.log

  docker-verify:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f infrastructure/docker/Dockerfile.backend -t ledger-backend:ci ./backend
      - name: Build frontend Docker image
        run: docker build -f infrastructure/docker/Dockerfile.frontend -t ledger-frontend:ci .

  security-hygiene:
    name: Secret & Dependency Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental private keys or .env files
        run: |
          if find . -maxdepth 3 -name ".env" -not -name ".env.example" | grep -q .; then
            echo "Found committed .env file"
            exit 1
          fi
          if git grep -n "BEGIN PRIVATE KEY" -- ':!.github/workflows/ci.yml'; then
            echo "Found private key material in repository"
            exit 1
          fi
          echo "Repository hygiene check passed."
