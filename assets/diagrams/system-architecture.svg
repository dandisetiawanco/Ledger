  <text x="324" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#4F5A54">CSV · SHA-256</text>

  <rect x="446" y="256" width="120" height="52" rx="5" fill="#F6F4EE" stroke="#DDD8CB"/>
  <text x="456" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#183D30">Reporting Engine</text>
  <text x="456" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#4F5A54">TB · P&amp;L · BS · CF</text>

  <rect x="578" y="256" width="120" height="52" rx="5" fill="#F6F4EE" stroke="#DDD8CB"/>
  <text x="588" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#183D30">Audit &amp; Budgets</text>
  <text x="588" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#4F5A54">Events · Alerts</text>

  <!-- Accounting Core foundation -->
  <rect x="314" y="322" width="384" height="52" rx="5" fill="#D6E8D4" stroke="#183D30"/>
  <text x="328" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#183D30">Double-Entry Accounting Core (JournalService · AccountService · PeriodService)</text>
  <text x="328" y="362" font-family="ui-monospace, monospace" font-size="10.5" fill="#183D30">BigDecimal · ACID Transactions · Immutable Journals · Row-Locked Sequences</text>

  <!-- Arrow 2 -->
  <line x1="716" y1="244" x2="758" y2="244" stroke="#183D30" stroke-width="2"/>
  <polygon points="758,238 770,244 758,250" fill="#183D30"/>

