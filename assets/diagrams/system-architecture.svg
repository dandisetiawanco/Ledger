<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" fill="none" role="img" aria-label="Ledger System Architecture Diagram">
  <rect width="960" height="440" rx="12" fill="#F6F4EE"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#183D30">Ledger Modular Monolith Architecture</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#4F5A54">Next.js App Router Frontend  ->  Spring Boot 3.4 Modular Backend (Java 21)  ->  PostgreSQL / H2 via Flyway</text>

  <!-- Frontend box -->
  <rect x="32" y="96" width="210" height="296" rx="8" fill="#FFFFFF" stroke="#183D30" stroke-width="1.5"/>
  <rect x="32" y="96" width="210" height="36" rx="8" fill="#183D30"/>
  <text x="48" y="119" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Frontend (Next.js :3002)</text>
  <text x="48" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#222222">Public Website</text>
  <text x="48" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">Home, Product, Accounting, Demo</text>
  <text x="48" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#222222">Accounting Workspace</text>
  <text x="48" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">COA, Journals, GL, Invoices,</text>
  <text x="48" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">Expenses, Banking, Reports</text>
  <text x="48" y="282" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#222222">Shared Packages</text>
  <text x="48" y="300" font-family="ui-monospace, monospace" font-size="11" fill="#183D30">@ledger/contracts (Decimal.js)</text>
  <text x="48" y="318" font-family="ui-monospace, monospace" font-size="11" fill="#183D30">@ledger/ui (Brand &amp; Tokens)</text>
  <rect x="48" y="340" width="178" height="34" rx="5" fill="#D6E8D4"/>
  <text x="60" y="361" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#183D30">/api/* Same-Origin Proxy</text>

  <!-- Arrow 1 -->
  <line x1="242" y1="244" x2="284" y2="244" stroke="#183D30" stroke-width="2"/>
  <polygon points="284,238 296,244 284,250" fill="#183D30"/>

  <!-- Backend box -->
  <rect x="296" y="96" width="420" height="296" rx="8" fill="#FFFFFF" stroke="#183D30" stroke-width="1.5"/>
  <rect x="296" y="96" width="420" height="36" rx="8" fill="#183D30"/>
  <text x="312" y="119" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Spring Boot Modular Monolith (Java 21 :8082)</text>

  <!-- Security bar -->
  <rect x="314" y="146" width="384" height="34" rx="5" fill="#EFECE3" stroke="#B9B2A2"/>
  <text x="326" y="167" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#222222">RequestIdFilter · Spring Security (HttpOnly Session + CSRF + RBAC + Rate Limit)</text>

  <!-- Domain modules grid -->
  <rect x="314" y="194" width="120" height="52" rx="5" fill="#F6F4EE" stroke="#DDD8CB"/>
  <text x="324" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#183D30">Invoicing &amp; PDF</text>
  <text x="324" y="233" font-family="system-ui, sans-serif" font-size="10" fill="#4F5A54">OpenPDF · Credits</text>

  <rect x="446" y="194" width="120" height="52" rx="5" fill="#F6F4EE" stroke="#DDD8CB"/>
