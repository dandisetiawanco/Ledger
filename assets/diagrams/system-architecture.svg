  <text x="456" y="233" font-family="system-ui, sans-serif" font-size="10" fill="#4F5A54">Idempotent · Locks</text>

  <rect x="578" y="194" width="120" height="52" rx="5" fill="#F6F4EE" stroke="#DDD8CB"/>
