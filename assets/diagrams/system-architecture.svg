  <text x="786" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">34 Flyway tables</text>
  <text x="786" y="232" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#222222">H2 File-Backed</text>
  <text x="786" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">PostgreSQL mode</text>
  <text x="786" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">Lightweight dev</text>
  <text x="786" y="306" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#222222">Private Storage</text>
  <text x="786" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">Receipt attachments</text>
  <text x="786" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A54">SHA-256 &amp; auth gate</text>
