<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" fill="none" role="img" aria-label="Ledger Invoice to Financial Statement Accounting Flow">
  <rect width="960" height="320" rx="12" fill="#F6F4EE"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="21" font-weight="600" fill="#183D30">Atomic Transaction-to-Statement Accounting Pipeline</text>

  <rect x="32" y="76" width="190" height="168" rx="8" fill="#FFFFFF" stroke="#183D30" stroke-width="1.5"/>
  <text x="48" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#183D30">1. Business Event</text>
  <text x="48" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Issue Invoice</text>
  <text x="48" y="152" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Record Payment</text>
  <text x="48" y="172" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Post Expense / Bill</text>
  <text x="48" y="192" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Issue Credit Note</text>
  <text x="48" y="212" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Manual Journal</text>

  <line x1="222" y1="160" x2="258" y2="160" stroke="#183D30" stroke-width="2"/>
  <polygon points="258,154 270,160 258,166" fill="#183D30"/>

  <rect x="270" y="76" width="215" height="168" rx="8" fill="#D6E8D4" stroke="#183D30" stroke-width="1.5"/>
  <text x="286" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#183D30">2. Invariant Gate (ACID)</text>
  <text x="286" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#183D30">Open Accounting Period</text>
  <text x="286" y="152" font-family="system-ui, sans-serif" font-size="11.5" fill="#183D30">Valid Org Posting Accounts</text>
  <text x="286" y="172" font-family="system-ui, sans-serif" font-size="11.5" fill="#183D30">Sum(Debit) == Sum(Credit)</text>
  <text x="286" y="192" font-family="system-ui, sans-serif" font-size="11.5" fill="#183D30">Unique Business Event Key</text>
  <text x="286" y="212" font-family="system-ui, sans-serif" font-size="11.5" fill="#183D30">Row-Locked Sequence / AR</text>

  <line x1="485" y1="160" x2="521" y2="160" stroke="#183D30" stroke-width="2"/>
  <polygon points="521,154 533,160 521,166" fill="#183D30"/>

  <rect x="533" y="76" width="180" height="168" rx="8" fill="#FFFFFF" stroke="#183D30" stroke-width="1.5"/>
  <text x="549" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#183D30">3. Immutable Ledger</text>
  <text x="549" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">journal_entries (POSTED)</text>
  <text x="549" y="152" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">journal_lines (base + orig)</text>
  <text x="549" y="172" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">audit_events appended</text>
  <text x="549" y="192" font-family="system-ui, sans-serif" font-size="11.5" fill="#4F5A54">Corrections via Reversal</text>

  <line x1="713" y1="160" x2="749" y2="160" stroke="#183D30" stroke-width="2"/>
  <polygon points="749,154 761,160 749,166" fill="#183D30"/>

  <rect x="761" y="76" width="167" height="168" rx="8" fill="#183D30"/>
  <text x="777" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4. Live Statements</text>
  <text x="777" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6E8D4">Trial Balance (Dr = Cr)</text>
  <text x="777" y="152" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6E8D4">Profit &amp; Loss</text>
  <text x="777" y="172" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6E8D4">Balance Sheet (A=L+E)</text>
  <text x="777" y="192" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6E8D4">Direct Cash Flow</text>
  <text x="777" y="212" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6E8D4">Historical AR/AP Aging</text>

  <text x="32" y="284" font-family="system-ui, sans-serif" font-size="12" fill="#4F5A54">No editable account balances exist. Every report aggregates posted journal lines directly within the organization's tenant boundary.</text>
</svg>
