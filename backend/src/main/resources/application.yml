server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ledger-backend
  profiles:
    default: h2
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

ledger:
  security:
    session-cookie-name: LEDGER_SESSION
    session-cookie-secure: ${LEDGER_SESSION_COOKIE_SECURE:false}
    session-ttl-hours: ${LEDGER_SESSION_TTL_HOURS:24}
    allowed-origins: ${LEDGER_ALLOWED_ORIGINS:http://localhost:3002,http://127.0.0.1:3002}
    login-rate-limit-max-attempts: 20
    login-rate-limit-window-seconds: 300
  storage:
    root-dir: ${LEDGER_STORAGE_DIR:./uploads}
    max-file-bytes: 10485760
  demo:
    auto-seed: ${LEDGER_DEMO_AUTO_SEED:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"
  level:
    com.ledger: INFO
    org.hibernate.SQL: WARN
