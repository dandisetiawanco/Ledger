spring:
  datasource:
    url: jdbc:h2:mem:ledger_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ledger
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ledger:
  demo:
    auto-seed: false
  storage:
    root-dir: ./target/test-uploads
